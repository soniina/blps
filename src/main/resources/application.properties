server.servlet.context-path=/citilink
spring.main.allow-bean-definition-overriding=true

# ???????? ??????
spring.datasource.jndi-name=java:jboss/datasources/CitilinkDS
spring.jpa.hibernate.ddl-auto=update

# ??????????
spring.jta.enabled=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# Camunda ???????
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.enforce-history-time-to-live=false

# ?????????? ???????? (?????!)
camunda.bpm.generic-properties.initialize-telemetry=false
camunda.bpm.generic-properties.schema-verification-enabled=false
camunda.bpm.generic-properties.bpmn20-xml-schema-validation-enabled=false
# ????????? ?????????? (?? ?????? ?????? ??? WildFly)
camunda.bpm.generic-properties.allow-doctype-decl=true

# ???? ? ?????????
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn

# ???????
spring.jms.jndi-name=java:/JmsXA
app.stomp.host=127.0.0.1
app.stomp.port=61613
app.stomp.queue-name=jms.queue.CreditRequestsQueue
app.eis.warehouse-jndi=java:/eis/WarehouseConnector

# ????
logging.level.root=INFO
logging.level.org.camunda.bpm=INFO