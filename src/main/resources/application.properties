spring.application.name=citilink
spring.datasource.jndi-name=java:jboss/datasources/CitilinkDS
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jta.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
spring.jpa.properties.hibernate.transaction.coordinator_class=jta

logging.level.org.springframework.transaction.jta=DEBUG
logging.level.org.hibernate.engine.transaction.jta.platform=DEBUG

spring.jpa.hibernate.ddl-auto=update

camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.enforce-history-time-to-live=false
camunda.bpm.generic-properties.initialize-telemetry=false
camunda.bpm.generic-properties.schema-verification-enabled=false
camunda.bpm.generic-properties.bpmn20-xml-schema-validation-enabled=false
camunda.bpm.generic-properties.allow-doctype-decl=true
camunda.bpm.deployment-resource-pattern=classpath*:/processes/*.bpmn, classpath*:/processes/*.form

# ????
logging.level.root=INFO
logging.level.org.camunda.bpm=INFO

camunda.bpm.job-execution.enabled=true