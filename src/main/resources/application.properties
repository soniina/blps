spring.application.name=citilink
spring.datasource.jndi-name=java:jboss/datasources/CitilinkDS
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jta.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
spring.jpa.properties.hibernate.transaction.coordinator_class=jta

logging.level.org.springframework.transaction.jta=DEBUG
logging.level.org.hibernate.engine.transaction.jta.platform=DEBUG

spring.jpa.hibernate.ddl-auto=update