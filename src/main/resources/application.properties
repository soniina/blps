server.servlet.context-path=/citilink

# ????????? ?????????
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
spring.thymeleaf.encoding=UTF-8

# ????????? Hibernate ??? JTA (WildFly)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.service.jta.platform.internal.JBossAppServerJtaPlatform
spring.jta.enabled=true

# ?????? ???????? ???????? ? ??????
spring.main.allow-bean-definition-overriding=true
spring.jpa.active-directory=false
spring.jpa.properties.wildfly.jpa.analyze=false
org.springframework.boot.logging.LoggingSystem=none

# ????????? ?????????????? ????????? ????, ????? Spring ?? ????? ??????? ? ??????
