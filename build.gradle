plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.24'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.24'
    id 'war'
}

group = 'itmo.blps'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    all {
        // 1. Полностью вырезаем Tomcat, чтобы Spring Boot не искал его классы в WildFly (Undertow)
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
        exclude group: 'org.apache.tomcat.embed'

        // 2. Исключаем стандартный логгер Spring, так как WildFly использует JBoss LogManager
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'

        // 3. Исключаем встроенный RESTEasy, чтобы он не конфликтовал с Jersey из Camunda
        exclude group: 'org.jboss.resteasy'
    }
}

dependencies {
    // Основные стартеры
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    // Работа под управлением Undertow (аналог сервера внутри WildFly)
    implementation 'org.springframework.boot:spring-boot-starter-undertow'
    providedRuntime 'org.springframework.boot:spring-boot-starter-undertow'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Jackson & XML
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Messaging
    implementation 'org.apache.activemq:activemq-stomp:6.1.7'
    runtimeOnly 'org.postgresql:postgresql'

    // Jakarta EE API (для компиляции)
    compileOnly 'jakarta.resource:jakarta.resource-api:2.1.0'
    compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:10.0.0'
    providedRuntime 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // Camunda 7.21.0
    implementation platform('org.camunda.bpm:camunda-bom:7.21.0')
    implementation 'org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-webapp'
    implementation 'org.camunda.bpm.springboot:camunda-bpm-spring-boot-starter-rest'

    // Критично для Hibernate 6 внутри WildFly
    implementation 'org.jboss.logging:jboss-logging:3.5.3.Final'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

sourceSets {
    main {
        java { srcDirs += 'src/main/kotlin' }
    }
}

// Сборка JCA адаптера
tasks.register('driverJar', Jar) {
    dependsOn 'classes'
    archiveFileName = "warehouse-driver.jar"
    from sourceSets.main.output
    include 'itmo/blps/citilink/warehouse/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Сборка RAR архива
tasks.register('buildRar', Zip) {
    dependsOn 'driverJar'
    archiveFileName = "warehouse-ra.rar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    archiveExtension = 'rar'
    from(driverJar.archiveFile)
    into('META-INF') { from 'src/main/resources/META-INF/ra.xml' }
}

bootWar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn 'buildRar'
    archiveFileName = 'ROOT.war'

    // Вырезаем классы адаптера из WAR (они будут в RAR)
    rootSpec.exclude('itmo/blps/citilink/warehouse/**')

    // ВАЖНО: Удаляем файлы инициализации javax из всех вложенных библиотек.
    // Это не дает "Трансформеру" WildFly упасть с ошибкой Duplicate Entry.
    rootSpec.exclude('**/javax.servlet.ServletContainerInitializer')
    rootSpec.exclude('META-INF/services/javax.servlet.ServletContainerInitializer')

    doLast {
        def targetPath = "${projectDir}/wildfly-shop/standalone/deployments"
        copy {
            from archiveFile
            from tasks.buildRar.archiveFile
            into targetPath
        }
    }
}