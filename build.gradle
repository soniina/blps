plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.24'
    id 'org.jetbrains.kotlin.plugin.spring' version '1.9.24'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
    id 'org.jetbrains.kotlin.plugin.jpa' version '1.9.24'
    id 'war'
}

group = 'itmo.blps'
version = '0.0.1-SNAPSHOT'
description = 'citilink'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-activemq'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // XML & JSON & Reflect
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    // Open API
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // Messaging
    implementation 'org.apache.activemq:activemq-stomp:6.1.2'

    // Database
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'jakarta.resource:jakarta.resource-api:2.0.0'
    compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.0'
    compileOnly 'jakarta.platform:jakarta.jakartaee-api:9.1.0'

    // Server & Test
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

allOpen {
    annotation 'jakarta.persistence.Entity'
    annotation 'jakarta.persistence.MappedSuperclass'
    annotation 'jakarta.persistence.Embeddable'
}

tasks.named('test') {
    useJUnitPlatform()
}
sourceSets {
    main {
        java {
            srcDirs += 'src/main/kotlin'
        }
    }
}

// собираем JAR со всеми скомпилированными классами
tasks.register('driverJar', Jar) {
    // Ждем завершения компиляции обоих языков
    dependsOn 'compileJava', 'compileKotlin'
    archiveFileName = "warehouse-driver.jar"

    // Берем все скомпилированные классы из всех директорий (java и kotlin)
    from sourceSets.main.output

    // Включаем только нужный пакет, чтобы не тащить лишнее из Spring
    include 'itmo/blps/warehouse/**'

    // На всякий случай дублируем стратегию имен
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// собираем RAR
tasks.register('buildRar', Zip) {
    dependsOn 'driverJar'
    archiveFileName = "warehouse-ra.rar"
    destinationDirectory = layout.buildDirectory.dir("libs")
    archiveExtension = 'rar'

    // Кладем наш JAR в корень RAR
    from(driverJar.archiveFile)

    into('META-INF') {
        from 'src/main/resources/META-INF/ra.xml'
    }
}

bootWar {
    archiveFileName = 'ROOT.war'
    rootSpec.exclude('itmo/blps/warehouse/**')
    doLast {
        def folderNames = ['wildfly-shop', 'wildfly-banks']
        folderNames.each { name ->
            def targetPath = "${projectDir}/${name}/standalone/deployments"
            copy {
                from archiveFile
                into targetPath
            }
        }
    }
}